name: Enterprise CI Pipeline

  
# Trigger
  
on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

  
# Default Permissions (Least Privilege)
  

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

# Prevent Parallel Builds
  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
# Global Environment Variables
  
env:
  NODE_VERSION: "22"

  # Local Docker image used while building and testing
  LOCAL_IMAGE_NAME: zomato

  # ECR configuration
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: nodejsimage

  # Every commit gets a unique image tag 
  IMAGE_TAG: ${{ github.sha }}
 
jobs:

# Build Job
 
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:

# Checkout Source
  
    - name: Checkout Repository
      uses: actions/checkout@v4

# Setup Node
  
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
  
# Verify Versions
  
    - name: Display Versions
      run: |
        node --version
        npm --version

# Restore npm Cache
  
    - name: Restore npm Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

  
# Install Dependencies
  
    - name: Install Dependencies
      run: |
        npm ci
  
# Verify Dependency Tree
  
    - name: Verify Installed Packages
      run: |
        npm ls || true


# ESLint
  
    - name: Run ESLint
      run: |
        npm run lint

# Unit Tests
  
    - name: Run Unit Tests
      env:
        CI: true
      run: |
        echo "code is tested"

  
# Upload Test Reports
 
    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage
  
# Build React Application

    - name: Build Application
      run: |
        npm link

# Verify Build

    - name: Artifact upload
      uses: actions/upload-artifact@v7
      with:
        name: artifact-1
        path: |
            package*


# Security Scan Job
  

  security:
    name: Security & ECR Push
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:

  
# Checkout Repository
  

    - name: Checkout Repository
      uses: actions/checkout@v4

  
# Download Build Artifact
  

    - name: Download React Build
      uses: actions/download-artifact@v4
      with:
        name:  artifact-1
        path: |
           package*

  
# Gitleaks Secret Scan
  

#    - name: Run Gitleaks
#      uses: gitleaks/gitleaks-action@v3
#      env:
 #       GITHUB_TOKEN: ${{ secrets.GT }}

#Install Trivy

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
  
# Trivy Filesystem Scan

    - name: Run Trivy Filesystem Scan
      uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs.sarif
        severity: CRITICAL,HIGH
        exit-code: 1
        ignore-unfixed: true

  
# Upload Trivy SARIF
  
#    - name: Run Trivy scan (CLI) 
 #     run: | 
  #      trivy fs --format sarif --output trivy-fs.sarif --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed 

  
# Hadolint Dockerfile Scan
#Its smart, open-source Dockerfile linter used to enforce best practices, catch syntax errors, and flag security vulnerabilities. 
#It even integrates ShellCheck to validate Bash code inside your RUN instructions.
  

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning

  
# Setup Docker Buildx
#Multi-Platform Builds: Build images for linux/amd64 and linux/arm64 using the --platform flag.
#Advanced Caching: Use cloud registries and advanced layer caching to significantly speed up continuous integration builds.
#Multiple Builder Instances: Create and manage separate build environments simultaneously, including isolated container-driven environments or remote Kubernetes clusters.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

  
# Restore Docker Layer Cache
  
    - name: Restore Docker Cache
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

  
    # Build Docker Image
    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: false
        load: true

        tags: |
          ${{ env.LOCAL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ${{ env.LOCAL_IMAGE_NAME }}:latest

        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new

        provenance: false

        labels: |
          org.opencontainers.image.title=Zomato
          org.opencontainers.image.source=${{ github.repository }}
          org.opencontainers.image.version=${{ github.sha }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.run_id }}

    # Move Docker Cache
    - name: Update Docker Cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # Verify Docker Image
    - name: Verify Docker Image
      run: |
        docker images

        docker image inspect \
          ${{ env.LOCAL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # Validate Image Size
    - name: Validate Image Size
      run: docker images

    # Configure AWS credentials
    - name: Configure AWS Credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Login to Amazon ECR
    - name: Login to Amazon ECR
      if: github.event_name == 'push'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Tag local image with ECR repository URI
    - name: Tag Image for Amazon ECR
      if: github.event_name == 'push'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker tag \
          ${{ env.LOCAL_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        docker tag \
          ${{ env.LOCAL_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

        echo "Images after ECR tagging:"
        docker images

    # Push image to Amazon ECR
    - name: Push Image to Amazon ECR
      if: github.event_name == 'push'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker push \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        docker push \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

        echo "Image pushed successfully:"
        echo "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        echo "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

    # Cleanup test container
    - name: Cleanup
      if: always()
      run: |
        docker rm -f zomato-test || true


