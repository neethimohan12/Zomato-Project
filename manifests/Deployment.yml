---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
        - name: cont-1
          image: 564395526804.dkr.ecr.ca-central-1.amazonaws.com/nodejsimage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
            
